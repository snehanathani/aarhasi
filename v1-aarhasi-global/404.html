<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — Aarhasi Global</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#0B0D12;color:#fff;font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;}
  .wrap{padding:40px;}
  .code{font-family:'Space Grotesk',sans-serif;font-size:96px;font-weight:700;color:#3B4FE0;line-height:1;}
  h1{font-family:'Space Grotesk',sans-serif;font-size:24px;margin:16px 0 10px;}
  p{color:#B8BFCC;font-size:15px;max-width:400px;margin:0 auto 28px;}
  a{display:inline-block;padding:13px 26px;background:#3B4FE0;color:#fff;border-radius:3px;text-decoration:none;font-weight:600;font-size:14px;}

  /* Responsive safeguards for 390px / 360px */
  @media (max-width: 640px) {
    .hero { padding-top: 130px !important; padding-bottom: 60px !important; }
    h1, .hero h1 { font-size: 32px !important; line-height: 1.18 !important; overflow-wrap: break-word !important; }
    h2 { font-size: 26px !important; line-height: 1.25 !important; }
    .eyebrow { font-size: 11px !important; line-height: 1.4 !important; }
    .hero p.lead, .hero p { font-size: 15.5px !important; line-height: 1.6 !important; }
    .nav { padding: 12px 0 !important; }
    .logo-text { font-size: 16px !important; }
    .hero-ctas, .btn-row { flex-direction: column !important; width: 100% !important; }
    .hero-ctas .btn, .btn-row .btn { width: 100% !important; text-align: center !important; justify-content: center !important; }
    .metric-list li { flex-direction: column !important; align-items: flex-start !important; }
  }
  @media (max-width: 380px) {
    h1, .hero h1 { font-size: 27px !important; }
    .wrap { padding: 0 16px !important; }
  }


  /* High-precision mobile typography fitting */
  @media (max-width: 640px) {
    .wrap { padding: 0 16px !important; }
    .hero { padding: 100px 0 50px !important; }
    h1, .hero h1 { font-size: 26px !important; line-height: 1.2 !important; word-break: normal !important; overflow-wrap: break-word !important; }
    .eyebrow { font-size: 10.5px !important; letter-spacing: 0.06em !important; white-space: normal !important; }
    .nav { padding: 10px 0 !important; }
    .logo-text { font-size: 15px !important; }
    .hero p.lead, .hero p { font-size: 14.5px !important; line-height: 1.55 !important; }
    .btn { padding: 10px 16px !important; font-size: 13px !important; }
  }


  /* Mobile header and headline fine-tuning */
  @media (max-width: 640px) {
    h1, .hero h1 { font-size: 23px !important; line-height: 1.22 !important; overflow-wrap: break-word !important; }
    .hero { padding-top: 140px !important; }
    header.site { padding: 12px 0 !important; }
    .notice-strip, .notice { font-size: 11px !important; padding: 6px 12px !important; }
  }

</style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>This page doesn't exist.</h1>
    <p>The page you're looking for may have moved, or hasn't been published yet. Let's get you back on track.</p>
    <a href="index.html">Return to homepage</a>
  </div>
</body>
</html>
